name: HMS CI/CD Pipeline

on:
  push:
    branches:
      - main
      - "HMS-*"
      - "feat/*"
      - "fix/*"
      - "chore/*"
      - "kanishk/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI & Quality Analysis
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hms_test
          POSTGRES_USER: hms_user
          POSTGRES_PASSWORD: hms_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: "ci-secret-key-for-automated-testing-only"
      DATABASE_URL: "postgresql://hms_user:hms_password@localhost:5432/hms_test"
      SECURE_SSL_REDIRECT: "false"
      CONN_MAX_AGE: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Verify database migration consistency
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations against PostgreSQL
        run: python manage.py migrate

      - name: Validate OpenAPI 3.0 schema generation
        run: python manage.py spectacular --validate --file schema.yml

      - name: Collect static assets
        run: python manage.py collectstatic --noinput

      - name: Reset backend coverage data
        run: coverage erase

      - name: Run automated test suite against PostgreSQL with coverage
        run: coverage run manage.py test

      - name: Generate coverage report
        run: |
          coverage report
          coverage html
          coverage xml -o coverage.xml
          coverage json -o coverage.json
          python scripts/check_coverage.py coverage.json

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: |
            coverage.xml
            coverage.json
            htmlcov/
          retention-days: 7

  frontend:
    name: Frontend CI (Next.js 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies using lockfile
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run frontend tests and enforce statement coverage
        run: npm run test:coverage

      - name: Upload frontend coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: |
            frontend/coverage/
          retention-days: 7

      - name: Build Next.js production bundle
        run: npm run build

  sonar:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage reports
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-report
          path: .

      - name: Download frontend coverage reports
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage

      - name: Verify coverage reports are available
        run: |
          test -s coverage.xml
          test -s frontend/coverage/lcov.info

      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
