# These organization/project keys were already recorded in this repository's
# previous Sonar configuration and README. Confirm them against the imported
# SonarQube Cloud project before the first scan; account access is not available
# in this workspace.
sonar.organization=pesu-hms-team12
sonar.projectKey=PESU-HMS-Team12_hostel-management-system
sonar.projectName=Hostel Management System
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Backend and frontend application code.
sonar.sources=accounts,allocations,api,auditlog,config,hostels,students,frontend/src

# Django tests live beside Python source; frontend tests live in frontend/tests.
# Test inclusions below classify these files as tests and remove them from the
# source scope so no file is indexed as both source and test.
sonar.tests=accounts,allocations,api,auditlog,hostels,students,frontend/tests
sonar.test.inclusions=**/tests.py,**/test_*.py,**/*_tests.py,frontend/tests/**

# Generated/dependency/build data is not application source. Django migrations
# are generated schema history, excluded from source metrics; all other
# project-owned Python and frontend source remains in scope.
sonar.exclusions=**/migrations/**,**/venv/**,**/.venv*/**,**/node_modules/**,frontend/.next/**,frontend/out/**,frontend/coverage/**,htmlcov/**,staticfiles/**,coverage.xml,coverage.json,**/*.pdf

# Coverage reports are generated by the backend and frontend CI jobs and
# downloaded to these paths before analysis.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Make CI wait for SonarQube Cloud's gate result and fail on a failed gate.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
