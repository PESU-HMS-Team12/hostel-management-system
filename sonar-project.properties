# SonarCloud Project Configuration for Hostel Management System (HMS)
sonar.projectKey=PESU-HMS-Team12_hostel-management-system
sonar.organization=pesu-hms-team12
sonar.projectName=Hostel Management System

# Source and Test roots
sonar.sources=accounts,allocations,auditlog,config,hostels,students,api
sonar.tests=accounts,allocations,auditlog,hostels,students,api

# Test file inclusions
sonar.test.inclusions=**/tests.py,**/test_*.py,**/*_tests.py

# Exclusions from analysis
sonar.exclusions=**/migrations/**,manage.py,venv/**,.venv/**,staticfiles/**,*.pdf,*.md

# Coverage reports
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Source file encoding
sonar.sourceEncoding=UTF-8

# Fail build if quality gate fails
sonar.qualitygate.wait=false
