openapi: 3.0.3
info:
  title: Hostel Management System API
  version: v1
  description: Versioned REST API for Hostel Management System (HMS), supporting authentication,
    student records, hostels, rooms, room allocations, transfers, vacations, and reports.
paths:
  /api/v1/admin/roles/:
    post:
      operationId: admin_roles_create
      description: |-
        Assign or update a user's HMS role.
        Logs role changes in the audit log for compliance (TC-SEC-05).
      summary: Assign or update user role
      tags:
      - Administration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoleAssignmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleAssignmentRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
        '400':
          description: Validation error
  /api/v1/admin/users/:
    get:
      operationId: admin_users_list
      description: |-
        List user accounts and their assigned HMS roles.
        Restricted to system administrators.
      summary: List all users and roles
      tags:
      - Administration
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/allocations/:
    get:
      operationId: allocations_list
      description: |-
        Endpoints for room allocation creation, listing, history, transfers, and vacations.
        All state-changing operations are transaction-safe with row-locking to prevent over-allocation.
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Search by student ID/name, room, or hostel
      - in: query
        name: status
        schema:
          type: string
        description: 'Filter by status: ''active'', ''completed'', ''all'''
      tags:
      - Allocations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Allocation'
          description: ''
    post:
      operationId: allocations_create
      description: Creates an active allocation for a student. Transaction-safe with
        room row locking.
      summary: Create room allocation
      tags:
      - Allocations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AllocationCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AllocationCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allocation'
          description: ''
  /api/v1/allocations/{id}/:
    get:
      operationId: allocations_retrieve
      description: |-
        Endpoints for room allocation creation, listing, history, transfers, and vacations.
        All state-changing operations are transaction-safe with row-locking to prevent over-allocation.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this allocation.
        required: true
      tags:
      - Allocations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allocation'
          description: ''
    put:
      operationId: allocations_update
      description: |-
        Endpoints for room allocation creation, listing, history, transfers, and vacations.
        All state-changing operations are transaction-safe with row-locking to prevent over-allocation.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this allocation.
        required: true
      tags:
      - Allocations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AllocationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AllocationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allocation'
          description: ''
    patch:
      operationId: allocations_partial_update
      description: |-
        Endpoints for room allocation creation, listing, history, transfers, and vacations.
        All state-changing operations are transaction-safe with row-locking to prevent over-allocation.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this allocation.
        required: true
      tags:
      - Allocations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAllocationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAllocationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAllocationRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allocation'
          description: ''
    delete:
      operationId: allocations_destroy
      description: |-
        Endpoints for room allocation creation, listing, history, transfers, and vacations.
        All state-changing operations are transaction-safe with row-locking to prevent over-allocation.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this allocation.
        required: true
      tags:
      - Allocations
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/allocations/{id}/transfer/:
    post:
      operationId: allocations_transfer_create
      description: Closes the current room allocation and atomically creates a new
        active allocation.
      summary: Transfer an active allocation
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this allocation.
        required: true
      tags:
      - Allocations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationTransferRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AllocationTransferRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AllocationTransferRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allocation'
          description: ''
  /api/v1/allocations/{id}/vacate/:
    post:
      operationId: allocations_vacate_create
      description: Records student check-out and completes the room allocation.
      summary: Vacate an active allocation
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this allocation.
        required: true
      tags:
      - Allocations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationVacateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AllocationVacateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AllocationVacateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allocation'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the CSRF cookie and returns the token in the response body.
      summary: Retrieve CSRF Token
      tags:
      - Authentication
      security:
      - {}
      responses:
        '200':
          description: CSRF token retrieved successfully
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticates the user and creates a secure server-side session
        cookie.
      summary: User Login
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
        '400':
          description: Invalid credentials or missing role
        '403':
          description: CSRF verification failed
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Flushes the current user session and invalidates session cookies.
      summary: User Logout
      tags:
      - Authentication
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Logged out successfully
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Returns profile details, role, and active room allocation (if a
        student).
      summary: Current User Profile
      tags:
      - Authentication
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
        '401':
          description: Authentication required
        '403':
          description: No HMS role assigned
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: Verifies database connectivity and service availability.
      summary: Service health check
      tags:
      - System
      security:
      - {}
      responses:
        '200':
          description: Service and database are operational
        '503':
          description: Database or service is unavailable
