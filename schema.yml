          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HostelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HostelRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
