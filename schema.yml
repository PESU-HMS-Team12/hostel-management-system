        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hostel'
          description: ''
  /api/v1/hostels/{id}/:
    get:
      operationId: hostels_retrieve
      description: CRUD endpoints for hostel properties and blocks.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this hostel.
        required: true
      tags:
      - Hostels
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hostel'
          description: ''
    put:
      operationId: hostels_update
      description: CRUD endpoints for hostel properties and blocks.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this hostel.
        required: true
      tags:
