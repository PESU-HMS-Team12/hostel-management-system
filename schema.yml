      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hostel'
          description: ''
    delete:
      operationId: hostels_destroy
      description: CRUD endpoints for hostel properties and blocks.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this hostel.
        required: true
      tags:
