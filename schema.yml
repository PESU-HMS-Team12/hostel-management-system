  /api/v1/students/{id}/deactivate/:
    post:
      operationId: students_deactivate_create
      description: Sets the student status to Inactive.
      summary: Deactivate a student
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this student.
        required: true
      tags:
      - Students
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
          description: ''
components:
  schemas:
    AdminUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        role:
          type: string
          nullable: true
          readOnly: true
        role_label:
          type: string
          nullable: true
          readOnly: true
        student_id:
          type: string
          nullable: true
          readOnly: true
      required:
      - id
      - role
      - role_label
      - student_id
      - username
    Allocation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: integer
        student_id:
          type: string
          readOnly: true
        student_name:
          type: string
          readOnly: true
        room:
          type: integer
        room_no:
          type: string
          readOnly: true
        room_type:
          type: string
          readOnly: true
        hostel_id:
