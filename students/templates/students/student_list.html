<!DOCTYPE html>
<html>
<head>
    <title>Students - HMS</title>
</head>
<body>
    <h1>Student Management</h1>

    <p>
        <a href="{% url 'student_create' %}">Add Student</a>
    </p>

    <form method="get">
        <input
            type="text"
            name="q"
            placeholder="Search by ID, name or course"
            value="{{ query }}"
        >

        <select name="status">
            <option value="">All Statuses</option>
            <option value="Active" {% if selected_status == "Active" %}selected{% endif %}>
                Active
            </option>
            <option value="Inactive" {% if selected_status == "Inactive" %}selected{% endif %}>
                Inactive
            </option>
        </select>

        <button type="submit">Search</button>
    </form>

    <hr>

    <table border="1" cellpadding="8">
        <tr>
            <th>Student ID</th>
            <th>Name</th>
            <th>Course</th>
            <th>Year</th>
            <th>Status</th>
            <th>Action</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.student_id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.course_program }}</td>
            <td>{{ student.year }}</td>
            <td>{{ student.status }}</td>
            <td>
                <a href="{% url 'student_detail' student.id %}">View</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="6">No students found.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
